name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Check compilation
        run: cargo +1.85.0 check --workspace --all-targets --locked

      - name: Run tests
        run: cargo +1.85.0 test --workspace --locked

      - name: Run lints
        run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings

  cometbft-e2e:
    name: CometBFT v0.38 process integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Install the Go toolchain required by the CometBFT genesis fixture
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.12'
          check-latest: false

      - id: cometbft
        name: Install the pinned CometBFT engine
        uses: ./.github/actions/setup-cometbft

      - name: Run real CometBFT handshake and restart test
        env:
          COMETBFT_BIN: ${{ steps.cometbft.outputs.bin }}
        run: >-
          cargo +1.85.0 test -p noxis-node --test cometbft_e2e --features research-testing --locked --
          --ignored --exact real_cometbft_handshake_empty_block_and_process_restart
